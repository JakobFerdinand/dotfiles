# Linux/macOS config, read from the default ~/.config/herdr/config.toml path.
# Windows uses config.windows.toml via HERDR_CONFIG_PATH: the
# [[keys.command]] plugin_action bindings below don't work there.
# Common settings are duplicated in config.windows.toml - keep both in sync.

onboarding = false
[theme]
name = "terminal"
auto_switch = false

[keys]
prefix = "ctrl+space"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[ui]
agent_panel_sort = "spaces"
